<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://storage.axory.com.br/imagens-saas-sites/1782507997191-logo_final.svg" />
    <link rel="icon" type="image/png" href="https://img.axory.com.br/insecure/rs:fit:180:180/q:95/plain/https://storage.axory.com.br/imagens-saas-sites/1782507997191-logo_final.svg@png" />
    <link rel="apple-touch-icon" href="https://img.axory.com.br/insecure/rs:fit:180:180/q:95/plain/https://storage.axory.com.br/imagens-saas-sites/1782507997191-logo_final.svg@png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Aplica o tema salvo ANTES da hidratação para não piscar (dark/light). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Tag Manager (carregamento SÓ na 1ª interação p/ performance) -->
    <!--
      O GTM (script pesado de terceiro) só carrega na PRIMEIRA interação do
      usuário (scroll/clique/toque/tecla). O `dataLayer` é inicializado na hora,
      então eventos enviados antes ficam enfileirados e disparam quando o GTM
      sobe (nada é perdido). Sem carregamento por timer: mantém a thread
      principal livre no carregamento inicial (melhora LCP/TBT). Usuários reais
      quase sempre interagem; páginas apenas "lidas" seguem contadas pelo Umami.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      (function (w, d, s, l, i) {
        var loaded = false;
        var events = ['scroll', 'mousemove', 'touchstart', 'click', 'keydown'];
        function loadGTM() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) { w.removeEventListener(e, onFirst); });
          w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var f = d.getElementsByTagName(s)[0],
              j = d.createElement(s),
              dl = l != 'dataLayer' ? '&l=' + l : '';
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
          f.parentNode.insertBefore(j, f);
        }
        function onFirst() { loadGTM(); }
        events.forEach(function (e) { w.addEventListener(e, onFirst, { passive: true }); });
      })(window, document, 'script', 'dataLayer', 'GTM-PX5GHNZK');
    </script>
    <!-- End Google Tag Manager -->

    <!-- Umami Analytics (defer: não bloqueia a renderização) -->
    <script defer src="https://analytics.axory.com.br/script.js" data-website-id="664b3c8f-8e85-42fb-a59e-03245f293140"></script>
    
    <!-- Preconnect para recursos externos -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    
    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//wa.me" />
    <link rel="dns-prefetch" href="//www.instagram.com" />
    <link rel="dns-prefetch" href="//www.youtube.com" />
    <link rel="dns-prefetch" href="//www.linkedin.com" />
    <link rel="dns-prefetch" href="//www.google-analytics.com" />
    
    <!-- Meta tags para SEO -->
    <title>Axory - Gestão Financeira Digital e Eficiente</title>
    <meta name="description" content="Transforme sua gestão financeira com a Axory. Consultoria empresarial, BPO financeiro e soluções digitais para empresas de todos os tamanhos." />
    <meta name="keywords" content="gestão financeira, consultoria empresarial, BPO financeiro, fluxo de caixa, planejamento estratégico" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Axory - Gestão Financeira Digital e Eficiente" />
    <meta property="og:description" content="Transforme sua gestão financeira com a Axory. Consultoria empresarial, BPO financeiro e soluções digitais." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://axory.com.br" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Axory - Gestão Financeira Digital" />
    <meta name="twitter:description" content="Transforme sua gestão financeira com a Axory." />
    
    <!-- Tema -->
    <meta name="theme-color" content="#0131FF" />
    
    <!-- Preload CRÍTICO - LCP -->
    <link rel="preload" href="/hero/light-800.webp" as="image" media="(min-width: 769px)" fetchpriority="high" />
    <link rel="preload" href="/hero/light-400.webp" as="image" media="(max-width: 768px)" fetchpriority="high" />
    
    <!-- Critical CSS inline OTIMIZADO -->
    <style>
      /* Reset e base otimizado */
      *,*::before,*::after{box-sizing:border-box}
      html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
      body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background-color:#FAFAFA;line-height:1.5;color:#1f2937;font-display:swap}
      
      /* Loading spinner crítico */
      .loading-spinner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border:3px solid #f3f3f3;border-top:3px solid #0131FF;border-radius:50%;animation:spin 1s linear infinite;z-index:9999}
      @keyframes spin{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}
      .loaded .loading-spinner{display:none}
      
      /* Otimização crítica de imagens */
      img{max-width:100%;height:auto;display:block;font-style:italic;background-repeat:no-repeat;background-size:cover}
      
      /* Hero image LCP otimizada */
      .hero-image{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;background-color:#f3f4f6}
      @media (min-width:768px){.hero-image{aspect-ratio:16/10}}
      
      /* Navbar crítico */
      .navbar{position:fixed;top:0;left:0;right:0;z-index:50;pointer-events:none}
      .navbar-content{pointer-events:auto;background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);border:1px solid rgba(229,231,235,0.5);border-radius:9999px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.1)}
      
      /* Hero section crítico */
      .hero-section{position:relative;overflow:hidden;padding-top:5rem;padding-bottom:3rem}
      .hero-bg{position:absolute;inset:0;background:#0131FF;border-radius:0 0 2rem 2rem}
      @media (min-width:768px){.hero-bg{border-radius:0 0 3rem 3rem}}
      
      /* Dark mode crítico */
      .dark{color-scheme:dark}
      .dark body{background-color:#111827;color:#f9fafb}
      .dark .hero-bg{background:#374151}
      
      /* Contenção de layout */
      .contain-layout{contain:layout}
      .contain-paint{contain:paint}
      .contain-size{contain:size}
      
      /* Otimização de focus */
      :focus-visible{outline:2px solid #0131FF;outline-offset:2px}
      
      /* Prevenção de FOUC */
      .section{opacity:0;animation:fadeIn 0.3s ease-out forwards}
      @keyframes fadeIn{to{opacity:1}}
      
      /* Redução de motion */
      @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}}
    </style>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PX5GHNZK"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <div id="root"></div>

    <!--
      Link estático para SEO/descoberta: como este site é um SPA (React),
      o conteúdo do #root só existe após o JavaScript rodar. Este link fica
      no HTML cru servido pelo nginx para o Google descobrir e indexar o ERP
      AXDEAL mesmo sem renderizar JS. É o MESMO destino exibido, de forma
      visível, na seção e no rodapé (não é cloaking). Sem nofollow, sem redirect.
    -->
    <div style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">
      <a href="https://axdeal.axory.com.br/" title="AXDEAL — ERP da Axory Capital Group">AXDEAL — ERP da Axory Capital Group</a>
    </div>

    <!-- Em dev: remove service workers antigos que causam tela branca -->
    <script type="module">
      if (import.meta.env.DEV && 'serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((r) => r.unregister()));
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
