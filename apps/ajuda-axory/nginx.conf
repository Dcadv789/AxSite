server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Evita redirects absolutos com esquema errado (http) atrás de proxy/Cloudflare.
    absolute_redirect off;

    # HTML de entrada: sempre revalidar para pegar os novos assets após cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Serve o HTML pré-renderizado de cada rota DIRETO (sem redirect de barra final),
    # para que crawlers/IAs leiam o conteúdo sem precisar seguir 301.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
